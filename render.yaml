# Render blueprint: deploy PAM's dev build (mock Smokeball + golden data).
# In Render: New + -> Blueprint -> connect this repo/branch. You'll be prompted
# for ANTHROPIC_API_KEY; PAM_ACCESS_CODE is generated for you (find it under
# the service's Environment tab — it's the login password, username "pm").
services:
  - type: web
    name: pam
    runtime: node
    plan: starter
    branch: claude/dads-platform-build-plan-lcppom
    disk:
      name: pam-data
      mountPath: /var/data
      sizeGB: 1
    # npm-installed pnpm avoids corepack's signature-verification breakage
    # (old corepack builds reject current pnpm releases after npm's key rotation).
    # --prod=false forces devDependencies (vite, react) even if NODE_ENV=production,
    # which the SPA build needs.
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm exec tsx src/server/main.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22.16.0'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PAM_DATA_DIR
        value: /var/data/pam-db
      - key: PAM_ACCESS_CODE
        generateValue: true
      # ── Real Smokeball (leave unset to run on the mock + golden data).
      # Staging first: SMOKEBALL_BASE_URL=https://stagingapi.smokeball.com
      #                SMOKEBALL_AUTH_URL=https://datastaging-auth.smokeball.com
      # Production:    https://api.smokeball.com / https://auth.smokeball.com
      - key: SMOKEBALL_BASE_URL
        sync: false
      - key: SMOKEBALL_AUTH_URL
        sync: false
      - key: SMOKEBALL_API_KEY
        sync: false
      - key: SMOKEBALL_CLIENT_ID
        sync: false
      - key: SMOKEBALL_CLIENT_SECRET
        sync: false
      - key: SMOKEBALL_REFRESH_TOKEN
        sync: false
      - key: SMOKEBALL_SCOPE
        sync: false
