<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAM — Phillips &amp; Millman</title>
<style>
  :root{
    --gold:#B3925A; --gold-deep:#96763F; --burgundy:#6E2228;
    --ink:#2A211E; --ink-2:#5C4F49; --ink-3:#8C7F78;
    --ground:#EFEAE1; --paper:#FAF8F3; --panel:#F3EFE7; --line:#DDD5C7;
    --alert:#A03B2E; --alert-bg:#F4E2DC;
  }
  @media (prefers-color-scheme: dark){:root{
    --gold:#C8A76B; --gold-deep:#D8BC85; --burgundy:#B0555C;
    --ink:#EDE6DB; --ink-2:#B5A99E; --ink-3:#877B72;
    --ground:#161211; --paper:#211B19; --panel:#191412; --line:#3A302B;
    --alert:#D97F6E; --alert-bg:#38221E;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
  .mark{position:relative;font-family:Georgia,serif;font-size:18px;letter-spacing:.12em;color:var(--gold-deep);padding:4px 10px}
  .mark b{font-weight:400;color:var(--burgundy)}
  .mark::before,.mark::after{content:"";position:absolute;width:9px;height:9px;border:0 solid var(--burgundy)}
  .mark::before{top:0;left:0;border-top-width:1.5px;border-left-width:1.5px}
  .mark::after{bottom:0;right:0;border-bottom-width:1.5px;border-right-width:1.5px}
  header .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}
  section{display:flex;flex-direction:column;min-height:0}
  section h2{font:600 11px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);padding:12px 20px 8px;margin:0}
  #brief{white-space:pre-wrap;overflow-y:auto;padding:0 20px 20px;font-family:ui-monospace,monospace;font-size:12.5px;border-right:1px solid var(--line)}
  #thread{flex:1;overflow-y:auto;padding:0 20px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:60ch;padding:9px 14px;border-radius:12px}
  .msg.user{align-self:flex-end;background:var(--burgundy);color:#F5EAD9}
  .msg.pam{align-self:flex-start;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap}
  .cites{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .cite{font-size:10.5px;font-weight:600;color:var(--burgundy);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
  .err{align-self:flex-start;background:var(--alert-bg);color:var(--alert);padding:9px 14px;border-radius:12px;font-size:12.5px}
  form{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--paper)}
  input{flex:1;font:inherit;padding:10px 14px;border:1.5px solid var(--line);border-radius:9px;background:var(--ground);color:var(--ink)}
  input:focus{outline:none;border-color:var(--gold)}
  button{font:600 13px system-ui;padding:10px 18px;border:0;border-radius:8px;background:var(--gold);color:#3A2B14;cursor:pointer}
  button:hover{background:var(--gold-deep)}
  @media (max-width:800px){main{grid-template-columns:1fr}#brief{display:none}}
</style>
</head>
<body>
<header>
  <span class="mark">P<b>A</b>M</span>
  <span class="sub">Phillips &amp; Millman · dev build · mock data</span>
</header>
<main>
  <section>
    <h2>Morning brief</h2>
    <div id="brief">Loading…</div>
  </section>
  <section>
    <h2>Chat</h2>
    <div id="thread"></div>
    <form id="f">
      <input id="q" placeholder="Ask PAM — e.g. What does my day look like?" autocomplete="off">
      <button>Send</button>
    </form>
  </section>
</main>
<script>
  const thread = document.getElementById('thread');
  let sessionId = null;

  fetch('/api/brief').then(r => r.json()).then(b => {
    document.getElementById('brief').textContent = b.text;
  }).catch(() => { document.getElementById('brief').textContent = 'Brief unavailable.'; });

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('q');
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    add('user', message);
    const pending = add('pam', '…');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({sessionId, message}),
      });
      const body = await res.json();
      if (!res.ok) { pending.className = 'err'; pending.textContent = body.error || 'Something went wrong.'; return; }
      sessionId = body.sessionId;
      pending.textContent = body.text;
      if (body.citations?.length) {
        const c = document.createElement('div');
        c.className = 'cites';
        for (const cit of body.citations.slice(0, 12)) {
          const chip = document.createElement('span');
          chip.className = 'cite';
          chip.textContent = cit.label;
          c.appendChild(chip);
        }
        pending.appendChild(c);
      }
    } catch (err) {
      pending.className = 'err';
      pending.textContent = 'Request failed: ' + err.message;
    }
    thread.scrollTop = thread.scrollHeight;
  });

  function add(kind, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    div.textContent = text;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
    return div;
  }
</script>
</body>
</html>
